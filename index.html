
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlk Web Sitem</title>
    <link rel="stylesheet" href="style.css">
</head>
<h2>Şu Anki Saat</h2>

<p id="clock">Saat yükleniyor...</p>
<button onclick="toggleTheme()">Temayı Değiştir</button>

<h2>Benimle İletişime Geç</h2>

<form id="contactForm" onsubmit="sendMessage(event)">

    <label for="name">Adınız:</label>
    <input type="text" id="name" required>

    <label for="email">E-posta adresiniz:</label>
    <input type="email" id="email" required>

    <label for="message">Mesajınız:</label>
    <textarea id="message" required></textarea>

    <button type="submit">Mesajı Gönder</button>

</form>

<script src="script.js"></script>
<body>

    <h1>Selam dört boynuzlu şeytan 👹</h1>


    <button onclick="showMessage()">Şeytanı Çağır 👹</button>
    

<h2>Kaan'ın Body Count'u 😈</h2>

<p><span id="count">0</span></p>

<button onclick="increaseCounter()">Bir tane daha ekle 😂</button>

<button onclick="resetCounter()">Kutsal suyla duş al 🚿</button>


</body>
</html>
